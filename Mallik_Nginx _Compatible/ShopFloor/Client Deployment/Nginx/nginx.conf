worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500m;

    # Include existing Mallik ERP configuration (Port 80)
    include locations/erp.locations.conf;

    # Include new ShopFloor configuration (Port 81)
    include locations/shopfloor.locations.conf;
}
