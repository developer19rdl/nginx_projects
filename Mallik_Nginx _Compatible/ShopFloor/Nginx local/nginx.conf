# ==============================================================================
# Nginx Master Orchestrator Configuration
# Location: C:\nginx\conf\nginx.conf (or local staging)
# ==============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500m;

    # --------------------------------------------------------------------------
    # Modular Application Includes
    # Loads individual server blocks for Mallik ERP (Port 80) and ShopFloor (Port 81)
    # --------------------------------------------------------------------------
    include locations/erp.locations.conf;
    include locations/shopfloor.locations.conf;
}
