# ==============================================================================
# Module: ShopFloor (Port 81)
# Dedicated server block for ShopFloor Frontend & Backend (Node / Executable)
# ==============================================================================

server {
    listen 81;
    server_name 192.168.8.8 localhost _;

    client_max_body_size 500m;

    # ── 1. ShopFloor Frontend (React Production Build) ──
    # Note: Update path below to match the client server's build directory if different
    location / {
        root "C:/Developer_19_Projects/Nginx demo/Mllik/ShopFloor/ShopFloor Frontend/build";
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Optional subpath alias if users open via http://<IP>:81/MallikShopFloor/
    location ^~ /MallikShopFloor/ {
        alias "C:/Developer_19_Projects/Nginx demo/Mllik/ShopFloor/ShopFloor Frontend/build/";
        index index.html;
        try_files $uri $uri/ /MallikShopFloor/index.html;
    }

    # ── 2. ShopFloor Backend API Proxy (Port 8003) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 3. ShopFloor Public Static Assets (logos, npd, checkimage, etc.) ──
    location /public/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root html;
    }
}
