# ==============================================================================
# Nginx Local Test Configuration for ShopFloor (Standalone - No ERP)
# Machine Local IP: 192.168.1.20
# ==============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500m;

    server {
        # Listen on Port 80 and Port 81 for testing convenience
        listen 80;
        listen 81;
        server_name 192.168.1.20 localhost _;

        # ── 1. ShopFloor Frontend (React Build) ──
        location / {
            root "C:/Developer_19_Projects/Nginx demo/Mllik/ShopFloor/ShopFloor Frontend/build";
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Compatibility for existing build asset prefix (/MallikShopFloor/MallikShopFloor/)
        location ^~ /MallikShopFloor/MallikShopFloor/ {
            alias "C:/Developer_19_Projects/Nginx demo/Mllik/ShopFloor/ShopFloor Frontend/build/";
            index index.html;
            try_files $uri $uri/ /MallikShopFloor/MallikShopFloor/index.html;
        }

        # Compatibility for standard subpath (/MallikShopFloor/)
        location ^~ /MallikShopFloor/ {
            alias "C:/Developer_19_Projects/Nginx demo/Mllik/ShopFloor/ShopFloor Frontend/build/";
            index index.html;
            try_files $uri $uri/ /MallikShopFloor/index.html;
        }

        # ── 2. ShopFloor Backend API Proxy (Port 8003) ──
        location /api/ {
            proxy_pass http://127.0.0.1:8003/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── 3. ShopFloor Public Static Assets (logos, npd, images) ──
        location /public/ {
            proxy_pass http://127.0.0.1:8003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
