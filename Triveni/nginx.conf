# Triveni Production Nginx Configuration for Windows
# Reverse proxy for Triveni MES: Admin Frontend, Operator UI, Express API, & Socket.IO WebSockets

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 500m;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Backend upstream (Node.js Express + Socket.IO server on port 5050)
    upstream triveni_backend {
        server 127.0.0.1:5050;
        keepalive 32;
    }

    server {
        listen 80;
        server_name 192.168.1.20 192.168.8.8 localhost _;

        # ----------------------------------------------------------------------
        # 1. Operator Web App (Shop-Floor UI / Kiosk)
        # Accessible at: http://<server-ip>/operator/
        # ----------------------------------------------------------------------
        location ^~ /operator/ {
            alias "C:/Developer_19_Projects/Nginx demo/Triveni/operator/dist/";
            index index.html;
            try_files $uri $uri/ /operator/index.html;
        }

        # ----------------------------------------------------------------------
        # 2. Management & Admin Portal (Planning, Dashboard, Quality, Inventory)
        # Accessible at: http://<server-ip>/
        # ----------------------------------------------------------------------
        location / {
            root "C:/Developer_19_Projects/Nginx demo/Triveni/frontend/dist";
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ----------------------------------------------------------------------
        # 3. Backend REST API Proxy
        # Forwards /api/ requests to Node.js backend (e.g. /api/v1/...)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://triveni_backend/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ----------------------------------------------------------------------
        # 4. Socket.IO Real-Time WebSockets Proxy
        # Provides live floor metrics, machine timers, & MQTT update broadcasts
        # ----------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://triveni_backend/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ----------------------------------------------------------------------
        # 5. File Uploads & Attachments Proxy
        # ----------------------------------------------------------------------
        location /uploads/ {
            proxy_pass http://triveni_backend/uploads/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 6. Health Check Endpoint
        # ----------------------------------------------------------------------
        location = /health {
            proxy_pass http://triveni_backend/health;
        }

        # Standard error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
