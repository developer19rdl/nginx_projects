# ==============================================================================
# Module: ShopFloor (Port 81)
# Dedicated server block for ShopFloor Frontend & Backend (Port 8004)
# ==============================================================================

server {
    listen 81;
    server_name 192.168.8.8 localhost _;

    client_max_body_size 500m;

    # ── 1. ShopFloor Frontend (React Production Build) ──
    # Compatibility for React build's internal asset prefix
    location ^~ /MallikShopFloor/MallikShopFloor/ {
        alias "D:/Shopfloor/Frontend/build/";
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Standard subpath (/MallikShopFloor/)
    location ^~ /MallikShopFloor/ {
        alias "D:/Shopfloor/Frontend/build/";
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Root access (http://localhost:81/)
    location / {
        root "D:/Shopfloor/Frontend/build";
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── 2. ShopFloor Backend API Proxy (Port 8004) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8004/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 3. ShopFloor Public Static Assets (logos, npd, images) ──
    location /public/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 4. ShopFloor Uploads ──
    location /uploads/ {
        proxy_pass http://127.0.0.1:8004/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root html;
    }
}