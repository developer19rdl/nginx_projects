# ==============================================================================
# Module: Mallik EMS - Energy Management System (Port 82)
# Dedicated server block for Mallik EMS Frontend & Backend (Port 8005)
# ==============================================================================

server {
    listen 82;
    server_name 192.168.8.8 localhost _;

    client_max_body_size 500m;

    # ── 1. Mallik EMS Frontend (React Production Build) ──
    # Standard subpath (/MallikEMS/)
    location ^~ /MallikEMS/ {
        alias "D:/EMS/frontend/build/build/";
        index index.html;
        try_files $uri $uri/ /MallikEMS/index.html;
    }

    # Short subpath (/EMS/)
    location ^~ /EMS/ {
        alias "D:/EMS/frontend/build/build/";
        index index.html;
        try_files $uri $uri/ /EMS/index.html;
    }

    # Root access (http://localhost:82/ or http://192.168.8.8:82/)
    location / {
        root "D:/EMS/frontend/build/build";
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── 2. EMS Backend API Proxy (Port 8005) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8005/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 3. EMS Real-Time Socket.IO (Port 8005) ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8005/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 4. EMS Public Static Assets (logos, building images, etc.) ──
    location /public/ {
        proxy_pass http://127.0.0.1:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 5. Error Pages ──
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root html;
    }
}
