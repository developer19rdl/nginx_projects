{% extends 'base.html' %}
{% block title %}Order Confirmed - ShopLite{% endblock %}

{% block content %}
<div class="success-page">
    <div class="success-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <h1>Order Confirmed!</h1>
    <p class="success-order-id">Order #{{ order_id }}</p>
    <p class="success-total">Total: ${{ "%.2f"|format(total) }}</p>
    <p>Your order has been placed successfully. Thank you for shopping!</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary">Continue Shopping</a>
</div>
{% endblock %}
